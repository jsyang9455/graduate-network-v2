services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: graduate-network-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graduate_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
      - ./database/migrations/010_v2_multischool.sql:/docker-entrypoint-initdb.d/3-v2-multischool.sql
    ports:
      - "5432:5432"
    networks:
      - graduate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  # REQ-NFR-010: JWT_SECRET / DB_PASSWORD come from host env or root `.env`
  # (copy `.env.example` → `.env`; never commit real secrets).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graduate-network-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: graduate_network
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the environment (see .env.example)}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CORS_ORIGIN: "*"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - graduate-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graduate-network-frontend
    volumes:
      - .:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - graduate-network
    restart: unless-stopped

networks:
  graduate-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
