services:
  # PostgreSQL Database
  # Service name must stay `postgres` (backend DB_HOST + depends_on).
  # container_name `graduate-network-db` is cosmetic only — do not depends_on it.
  postgres:
    image: postgres:15-alpine
    container_name: graduate-network-db
    environment:
      # Keep in sync with backend DB_* (from host `.env` / .env.example).
      # POSTGRES_* apply only on first volume init; changing .env later does not
      # rewrite an existing postgres_data volume.
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-graduate_network}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
      - ./database/migrations/010_v2_multischool.sql:/docker-entrypoint-initdb.d/3-v2-multischool.sql
    ports:
      - "5432:5432"
    # Small EC2: default /dev/shm (64MB) can make Postgres crash under load/init.
    shm_size: 256mb
    networks:
      - graduate-network
    restart: unless-stopped
    healthcheck:
      # First boot runs schema+seed+010; without start_period, early pg_isready
      # failures mark the container unhealthy and backend depends_on fails with
      # "dependency postgres failed to start".
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # Backend API
  # REQ-NFR-010: JWT_SECRET / DB_PASSWORD come from host env or root `.env`
  # (copy `.env.example` → `.env`; never commit real secrets).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graduate-network-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: graduate_network
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the environment (see .env.example)}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CORS_ORIGIN: "*"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
      # Startup applyPendingMigrations + `npm run migrate` resolve to /database/migrations
      # (see backend/scripts/apply-migrations.js). Without this mount, production
      # start exits → nginx 502 on /api/*.
      - ./database:/database:ro
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - graduate-network
    restart: unless-stopped
    healthcheck:
      # node:alpine has no wget by default — probe with Node.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # Frontend
  # nginx.conf is baked into the image (/etc/nginx/conf.d/). After changing it:
  #   docker compose up -d --build frontend
  # The bind mount refreshes HTML/JS/CSS after git pull without rebuild, but does
  # NOT update nginx.conf. Sensitive paths are denied in nginx.conf.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graduate-network-frontend
    volumes:
      - .:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - graduate-network
    restart: unless-stopped

networks:
  graduate-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
