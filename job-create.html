<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채용 공고 등록 - 전북지역 졸업생 네트워크</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/jobs.css">
</head>
<body>
    <header id="mainHeader">
        <nav>
            <div class="logo">
                <img src="images/logo.svg" alt="JJOBB 전북지역 졸업생 취업지원플랫폼" class="logo-img" width="158" height="40">
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html">대시보드</a></li>
                <li><a href="jobs.html" class="active">채용 정보</a></li>
                <li><a href="networking.html">JOB밴드</a></li>
            </ul>
            <div class="user-menu">
                <span class="user-name" id="userName"></span>
                <button onclick="auth.logout()" class="btn-logout">로그아웃</button>
            </div>
        </nav>
    </header>

    <div class="job-form-container">
        <h1>채용 공고 등록</h1>
        <form id="jobCreateForm">
            <div class="form-group">
                <label for="title">채용 제목 *</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label for="description">채용 내용 *</label>
                <textarea id="description" rows="10" required></textarea>
            </div>
            <div class="form-group">
                <label for="type">채용 유형 *</label>
                <select id="type" required>
                    <option value="">선택하세요</option>
                    <option value="full-time">정규직</option>
                    <option value="part-time">파트타임</option>
                    <option value="contract">계약직</option>
                    <option value="internship">인턴</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">근무 지역</label>
                <input type="text" id="location">
            </div>
            <div class="form-group">
                <label for="salary">급여 정보</label>
                <input type="text" id="salary">
            </div>
            <div class="form-group">
                <label for="deadline">마감일</label>
                <input type="date" id="deadline">
            </div>
            <div class="form-group">
                <label for="headcount">채용 모집인원</label>
                <input type="number" id="headcount" min="1" placeholder="예: 3">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">등록</button>
                <button type="button" onclick="location.href='jobs.html'" class="btn-secondary">취소</button>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/jobs.js"></script>
</body>
</html>
