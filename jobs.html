</head>
<body>
    <header id="mainHeader">
        <nav>
            <div class="logo">
                <img src="images/logo-wordmark.svg" alt="JJOBB 전북지역 졸업생 취업지원플랫폼" class="logo-img" width="89" height="20">

                <li><a href="counseling.html">진로 상담</a></li>
                <li><a href="help.html">도움말</a></li>
            </ul>
            <div class="user-menu">
                <span class="user-name" id="userName"></span>
                <button onclick="auth.logout()" class="btn-logout">로그아웃</button>
            </div>
        </nav>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="index.html" class="menu-item">
                    <span class="icon" data-icon="home" aria-hidden="true"></span>
                    <span>홈</span>
                </a>
                <a href="dashboard.html" class="menu-item">
                    <span class="icon" data-icon="dashboard" aria-hidden="true"></span>
                    <span>대시보드</span>
                </a>
                <a href="profile.html" class="menu-item">
                    <span class="icon" data-icon="profile" aria-hidden="true"></span>
                    <span>내 프로필</span>
                </a>
                <a href="jobs.html" class="menu-item active">
                    <span class="icon" data-icon="jobs" aria-hidden="true"></span>
                    <span>채용 정보</span>
                </a>
                <a href="networking.html" class="menu-item">
                    <span class="icon" data-icon="network" aria-hidden="true"></span>
                    <span>JJOBB 밴드</span>
                </a>
                <a href="counseling.html" class="menu-item" id="counselingMenu">
                    <span class="icon" data-icon="counsel" aria-hidden="true"></span>
                    <span>진로 상담</span>
                </a>
                <a href="career.html" class="menu-item" id="careerMenu">
                    <span class="icon" data-icon="career" aria-hidden="true"></span>
                    <span>경력 관리</span>
                </a>
                <a href="education-programs.html" class="menu-item">
                    <span class="icon" data-icon="education" aria-hidden="true"></span>
                    <span>교육 프로그램</span>
                </a>
                <div style="border-top: 1px solid #e5e7eb; margin: 1rem 0; padding-top: 1rem;">
                    <p style="padding: 0 1rem; color: #6b7280; font-size: 0.875rem; font-weight: 600;">공지사항</p>
                </div>
                <a href="job-fair.html" class="menu-item">
                    <span class="icon" data-icon="company" aria-hidden="true"></span>
                    <span>취업 박람회</span>
                </a>
                <a href="industry-visit.html" class="menu-item">
                    <span class="icon" data-icon="visit" aria-hidden="true"></span>
                    <span>산업체 견학</span>
                </a>
                <a href="certification-support.html" class="menu-item">
                    <span class="icon" data-icon="cert" aria-hidden="true"></span>
                    <span>자격증 지원</span>
                </a>
                <!-- 관리자 메뉴 -->
                <div id="adminMenuSection" style="display: none;">
                    <div style="border-top: 1px solid #e5e7eb; margin: 1rem 0; padding-top: 1rem;">
                        <p style="padding: 0 1rem; color: #6b7280; font-size: 0.875rem; font-weight: 600;">관리자 메뉴</p>
                    </div>
                    <a href="admin-users.html" class="menu-item">
                        <span class="icon" data-icon="users" aria-hidden="true"></span>
                        <span>회원 관리</span>
                    </a>
                    <a href="admin-jobs.html" class="menu-item">
                        <span class="icon" data-icon="jobs" aria-hidden="true"></span>
                        <span>채용공고 관리</span>
                    </a>
                    <a href="admin-board.html" class="menu-item">
                        <span class="icon" data-icon="board" aria-hidden="true"></span>
                        <span>게시판 관리</span>
                    </a>
                    <a href="admin-codes.html" class="menu-item">
                        <span class="icon" data-icon="settings" aria-hidden="true"></span>
                        <span>코드 관리</span>
                    </a>
                    <a href="admin-announcements.html" class="menu-item">
                        <span class="icon" data-icon="announce" aria-hidden="true"></span>
                        <span>공지사항 관리</span>
                    </a>
                </div>
            </div>
        </aside>

        <main class="main-content">
        <div class="jobs-container">
        <div class="jobs-header">
            <div>
                <h1>채용 정보</h1>
                <p class="jobs-count" id="jobsCount"></p>
            </div>
            <div class="jobs-actions" id="jobsActions">
                <!-- Actions will be shown based on user type -->
            </div>
        </div>

        <div class="jobs-filters">
            <input type="search" id="searchInput" placeholder="회사명, 공고명으로 검색" aria-label="채용 공고 검색">
            <select id="typeFilter" aria-label="고용 형태">
                <option value="">전체 유형</option>
                <option value="full-time">정규직</option>
                <option value="contract">계약직</option>
                <option value="part-time">파트타임</option>
                <option value="internship">인턴</option>
            </select>
            <select id="statusFilter" aria-label="모집 상태">
                <option value="">전체 상태</option>
                <option value="open">진행중</option>
                <option value="closed">마감</option>
            </select>
            <button type="button" class="btn btn-primary btn-search">검색</button>
        </div>

        <div id="jobsList" class="jobs-list">
            <!-- Jobs will be loaded dynamically -->
        </div>
    </div>
        </main>
    </div>

    <!-- 지원 시 이력서 선택 (REQ-JOB-005) -->
    <div id="applyResumeModal" class="job-modal" onclick="if(event.target===this)closeApplyResumeModal()" style="display:none;">
        <div class="job-modal-dialog job-modal-dialog--sm" role="dialog" aria-modal="true" aria-labelledby="applyResumeTitle">
            <h2 id="applyResumeTitle" class="job-modal-title">이력서 선택 후 지원</h2>
            <p id="applyJobSummary" class="job-modal-sub"></p>
            <label for="applyResumeSelect" class="job-modal-label">첨부할 이력서</label>
            <select id="applyResumeSelect" class="job-modal-select"></select>
            <p id="applyResumeHint" class="job-modal-hint">대표 이력서가 기본 선택됩니다. 다른 이력서를 고를 수 있습니다.</p>
            <div class="job-modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeApplyResumeModal()">취소</button>
                <button type="button" id="applyResumeSubmitBtn" class="btn btn-primary">지원하기</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/jobs.js"></script>

    <!-- 채용공고 상세보기 모달 -->
    <div id="jobDetailModal" class="job-modal" onclick="if(event.target===this)closeJobDetailModal()" style="display:none;">
        <div class="job-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="jdPosition">
            <div class="job-modal-head">
                <div>
                    <span id="jdCompanyType" class="job-modal-chip"></span>
                    <p id="jdCompany" class="job-modal-company"></p>
                    <h2 id="jdPosition" class="job-modal-title"></h2>
                </div>
                <button type="button" class="job-modal-close" onclick="closeJobDetailModal()" aria-label="닫기">&times;</button>
            </div>
            <div id="jdContent"></div>
        </div>
    </div>
    <script>
        function closeJobDetailModal() {
            document.getElementById('jobDetailModal').style.display = 'none';
        }
    </script>
</body>
</html>
