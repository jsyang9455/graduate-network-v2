<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 전북지역 졸업생 네트워크</title>
    <link rel="icon" type="image/svg+xml" href="images/logo-symbol.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="index.html"><img src="images/logo-wordmark.svg" alt="JJOBB 전북지역 졸업생 취업지원플랫폼" class="logo-img" width="89" height="20"></a>
            </div>
            <div class="nav-links">
                <a href="index.html">홈</a>
                <a href="#" onclick="navigateWithAuth(event, 'jobs.html')">채용 정보</a>
                <a href="#" onclick="navigateWithAuth(event, 'networking.html')">JJOBB 밴드</a>
                <a href="#" onclick="navigateWithAuth(event, 'counseling.html')">진로 상담</a>
            </div>
            <div class="auth-buttons" id="authButtons">
                <a href="login.html" class="btn btn-secondary">로그인</a>
                <a href="register.html" class="btn btn-primary">회원가입</a>
            </div>
            <div class="user-menu" id="userMenu" style="display: none;">
                <span id="userName"></span>
                <button onclick="logout()" class="btn btn-secondary">로그아웃</button>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-box login-box">
            <div class="auth-header">
                <h1>JJOBB 로그인</h1>
                <p>전북지역 졸업생 네트워크 플랫폼</p>
            </div>
            
            <div id="loginError" class="error-message" style="display: none;"></div>
            <div id="loginSuccess" class="success-message" style="display: none;"></div>

            <div id="loginFormContainer">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" required 
                               placeholder="example@email.com"
                               autocomplete="email"
                               autocorrect="off"
                               autocapitalize="off"
                               spellcheck="false">
                    </div>

                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" name="password" required 
                               placeholder="비밀번호를 입력하세요"
                               autocomplete="current-password">
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                        <span>로그인 상태 유지</span>
                    </label>
                    <a href="#" class="link">비밀번호 찾기</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">로그인</button>

                <div class="auth-footer">
                    <p>계정이 없으신가요? <a href="register.html" class="link">회원가입</a></p>
                </div>
            </form>
            </div>
        </div>

        <div class="auth-info auth-visual">
            <div class="auth-visual-copy">
                <p class="auth-visual-eyebrow">JJOBB</p>
                <h2>전북의 졸업생과 기업을<br>잇는 취업 네트워크</h2>
            </div>
            <div class="info-card">
                <div class="info-icon service-icon" data-icon="education" aria-hidden="true"></div>
                <div>
                    <h3>학생 및 졸업생</h3>
                    <p>채용 정보 · JJOBB 밴드 · 진로 상담</p>
                </div>
            </div>
            <div class="info-card">
                <div class="info-icon service-icon" data-icon="company" aria-hidden="true"></div>
                <div>
                    <h3>기업</h3>
                    <p>채용 공고 등록 · 인재 발굴 · 기업 정보 관리</p>
                </div>
            </div>
            <div class="info-card">
                <div class="info-icon service-icon" data-icon="counsel" aria-hidden="true"></div>
                <div>
                    <h3>교사</h3>
                    <p>진로 상담 · 취업 지원 · 교육 프로그램 관리</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="auth-footer-bottom">
        <div class="container">
            <p>&copy; 2025 전주공업고등학교. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">개인정보처리방침</a>
                <a href="#">이용약관</a>
                <a href="#">고객센터</a>
            </div>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
