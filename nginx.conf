server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve `backend` at request time (not only at
    # nginx -t / startup). Avoids "host not found in upstream" crash-loops
    # when the frontend container races compose networking on small EC2.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Shared proxy headers for API locations
    # (exact health aliases + prefix /api/)

    # Exact health aliases — without these, /health is served as static → 404
    location = /health {
        set $api_upstream backend:5000;
        # Full target URI is intentional for the exact alias only.
        proxy_pass http://$api_upstream/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location = /api/health {
        set $api_upstream backend:5000;
        proxy_pass http://$api_upstream/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # All other Express routes (/api/auth/login, /api/schools, …)
    location /api/ {
        set $api_upstream backend:5000;
        # CRITICAL: with a *variable* proxy_pass, never append a URI path
        # (e.g. http://$api_upstream/api/). Nginx then replaces the *entire*
        # request URI with that path — /api/auth/login collapses to /api/ and
        # Express returns NOT_FOUND (while exact = /api/health still works).
        # Host-only proxy_pass keeps the original $request_uri (/api/...).
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Backend may still be warming (migrate/listen); avoid instant 502 flaps.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502;
    }

    # Compose bind-mounts the repo root as html; block source / secrets
    location ~ ^/(backend|database|docs|\.git|\.env|node_modules)(/|$) {
        deny all;
        return 404;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Disable cache for JS and CSS during development
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache static assets (images only)
    location ~* \.(jpg|jpeg|png|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
