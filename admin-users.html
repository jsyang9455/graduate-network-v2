<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 관리 - 관리자</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="dashboard.html" class="menu-item">
                    <span class="icon">🏠</span>
                    <span>대시보드</span>
                </a>
                <div style="border-top: 1px solid #e5e7eb; margin: 1rem 0; padding-top: 1rem;">
                    <p style="padding: 0 1rem; color: #6b7280; font-size: 0.875rem; font-weight: 600;">관리자 메뉴</p>
                </div>
                <a href="admin-users.html" class="menu-item active">
                    <span class="icon">👥</span>
                    <span>회원 관리</span>
                </a>
                <a href="admin-jobs.html" class="menu-item">
                    <span class="icon">💼</span>
                    <span>채용공고 관리</span>
                </a>
                <a href="admin-board.html" class="menu-item">
                    <span class="icon">📋</span>
                    <span>게시판 관리</span>
                </a>
                <a href="admin-codes.html" class="menu-item">
                    <span class="icon">⚙️</span>
                    <span>코드 관리</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <button onclick="auth.logout()" class="btn-logout">로그아웃</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>회원 관리</h1>
                <div class="user-info">
                    <span id="userName"></span>
                </div>
            </header>

            <div class="admin-content">
                <!-- 탭 네비게이션 -->
                <div id="userTabs" class="admin-tabs" role="tablist">
                    <button type="button" id="tabActive" class="admin-tab active" onclick="switchUserTab('active')">활성 회원 <span id="activeCount" class="admin-tab-badge admin-tab-badge--count">-</span></button>
                    <button type="button" id="tabCompanies" class="admin-tab" onclick="switchUserTab('companies')">기업 승인 <span id="companyPendingCount" class="admin-tab-badge admin-tab-badge--pending">-</span></button>
                    <button type="button" id="tabWithdrawn" class="admin-tab" onclick="switchUserTab('withdrawn')">탈퇴 회원 <span id="withdrawnCount" class="admin-tab-badge admin-tab-badge--danger">-</span></button>
                </div>

                <div id="companyApprovalFilters" class="admin-filter-bar" style="display:none;">
                    <label for="companyApprovalFilter">승인 상태</label>
                    <select id="companyApprovalFilter">
                        <option value="pending">대기</option>
                        <option value="approved">승인</option>
                        <option value="rejected">반려</option>
                        <option value="">전체</option>
                    </select>
                    <button type="button" class="btn btn-primary" onclick="loadCompanyApprovals()">조회</button>
                </div>

                <div class="admin-filter-bar filter-section" id="userFilterSection">
                    <input type="text" id="searchUser" placeholder="이름, 이메일로 검색..." style="flex:1; min-width:160px;">
                    <select id="userTypeFilter" style="min-width:150px;">
                        <option value="">전체 유형</option>
                        <option value="student">학생</option>
                        <option value="graduate">졸업생</option>
                        <option value="teacher">선생님</option>
                        <option value="company">기업</option>
                        <option value="admin">관리자</option>
                    </select>
                    <button onclick="filterUsers()" class="btn btn-primary">검색</button>
                </div>

                <div class="users-table" id="usersTableWrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>이름</th>
                                <th>이메일</th>
                                <th>유형</th>
                                <th>전화번호</th>
                                <th>학교/회사</th>
                                <th>학과명</th>
                                <th>전공</th>
                                <th id="thJoinDate">등록일</th>
                                <th id="thWithdrawnDate" style="display:none;">탈퇴일</th>
                                <th id="thWithdrawReason" style="display:none;">탈퇴 사유</th>
                                <th id="thActions" style="text-align:center;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Users will be loaded here -->
                        </tbody>
                    </table>
                    <div id="paginationContainer"></div>
                </div>

                <div class="users-table" id="companiesTableWrap" style="display:none;">
                    <table>
                        <thead>
                            <tr>
                                <th>기업명</th>
                                <th>담당자</th>
                                <th>이메일</th>
                                <th>업종</th>
                                <th>학교</th>
                                <th>상태</th>
                                <th>가입일</th>
                                <th style="text-align:center;">처리</th>
                            </tr>
                        </thead>
                        <tbody id="companiesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 회원 수정 모달 -->
    <div id="editUserModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 640px;">
            <div class="modal-header">
                <h2>회원 정보 수정</h2>
                <span class="close" onclick="closeEditUserModal()">&times;</span>
            </div>
            <div class="modal-body" style="max-height:80vh;overflow-y:auto;">
                <form id="editUserForm">
                    <input type="hidden" id="editUserId">

                    <h4 style="margin:0 0 1rem;color:#374151;border-bottom:1px solid #e5e7eb;padding-bottom:0.5rem;">기본 정보</h4>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div class="form-group">
                            <label>이름 <span style="color:red">*</span></label>
                            <input type="text" id="editUserName" required style="width:100%;">
                        </div>
                        <div class="form-group">
                            <label>이메일 <span style="color:red">*</span></label>
                            <input type="email" id="editUserEmail" required style="width:100%;">
                        </div>
                        <div class="form-group">
                            <label>전화번호</label>
                            <input type="tel" id="editUserPhone" placeholder="010-0000-0000" style="width:100%;">
                        </div>
                        <div class="form-group">
                            <label>회원 유형 <span style="color:red">*</span></label>
                            <select id="editUserType" required style="width:100%;">
                                <option value="student">학생</option>
                                <option value="graduate">졸업생</option>
                                <option value="teacher">선생님</option>
                                <option value="company">기업</option>
                                <option value="admin">관리자</option>
                            </select>
                        </div>
                    </div>

                    <!-- 상담교사 지정 (교사 유형일 때만 표시) -->
                    <div id="counselorSection" style="display:none; margin:1rem 0; padding:1rem 1.25rem; background:#f0f9ff; border-radius:10px; border:1.5px solid #bae6fd;">
                        <h4 style="margin:0 0 0.6rem;color:#0369a1;font-size:0.95rem;">📋 상담 권한 설정</h4>
                        <label style="display:flex;align-items:center;gap:0.6rem;cursor:pointer;font-size:0.95rem;">
                            <input type="checkbox" id="editUserIsCounselor" style="width:18px;height:18px;cursor:pointer;">
                            <span>상담교사로 지정 <span style="color:#6b7280;font-size:0.85rem;">(학생 상담 신청/교사 목록에 노출됩니다)</span></span>
                        </label>
                    </div>

                    <h4 style="margin:1.5rem 0 1rem;color:#374151;border-bottom:1px solid #e5e7eb;padding-bottom:0.5rem;">학력 / 직업 정보</h4>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                        <div class="form-group">
                            <label>학교명</label>
                            <input type="text" id="editUserSchool" placeholder="학교명" style="width:100%;">
                        </div>
                        <div class="form-group">
                            <label>학과명</label>
                            <input type="text" id="editUserDept" placeholder="학과명" style="width:100%;">
                        </div>
                        <div class="form-group">
                            <label>전공</label>
                            <input type="text" id="editUserMajor" placeholder="전공" style="width:100%;">
                        </div>
                        <div class="form-group">
                            <label>졸업연도</label>
                            <input type="text" id="editUserGradYear" inputmode="numeric" pattern="[0-9]{4}" placeholder="예: 2024" maxlength="4" style="width:100%;box-sizing:border-box;">
                        </div>
                        <div class="form-group" style="grid-column:1/-1;">
                            <label>희망직종</label>
                            <input type="text" id="editUserDesiredJob" placeholder="희망직종" style="width:100%;">
                        </div>
                    </div>

                    <div class="form-actions" style="margin-top:1.5rem;">
                        <button type="submit" class="btn btn-primary">저장</button>
                        <button type="button" onclick="closeEditUserModal()" class="btn btn-secondary">취소</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/admin-users.js"></script>
</body>
</html>
