<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인정보 동의서 출력 - JJOBB</title>
    <link rel="icon" type="image/svg+xml" href="images/logo-symbol.svg">
    <style>
        body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #111; margin: 0; background: #f3f4f6; }
        .toolbar { position: sticky; top: 0; background: #0f2b4c; color: #fff; padding: 0.75rem 1.25rem; display: flex; gap: 0.75rem; align-items: center; }
        .toolbar button, .toolbar a { background: #fff; color: #0f2b4c; border: 0; border-radius: 6px; padding: 0.45rem 0.9rem; cursor: pointer; text-decoration: none; font-weight: 600; }
        .sheet { max-width: 800px; margin: 1.5rem auto; background: #fff; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 1.25rem; text-align: center; margin: 0 0 1.25rem; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { border: 1px solid #cbd5e1; padding: 0.6rem 0.75rem; font-size: 0.92rem; vertical-align: top; }
        th { background: #f8fafc; width: 28%; text-align: left; }
        .checks { margin: 1rem 0; line-height: 1.8; }
        .sign { margin-top: 2rem; text-align: right; }
        .muted { color: #64748b; font-size: 0.85rem; }
        @media print {
            .toolbar { display: none; }
            body { background: #fff; }
            .sheet { box-shadow: none; margin: 0; max-width: none; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <strong>개인정보 동의서 출력</strong>
        <button type="button" onclick="window.print()">인쇄</button>
        <a href="admin-users.html">회원 관리로</a>
    </div>
    <div class="sheet" id="sheet">
        <p class="muted">불러오는 중...</p>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            auth.requireAuth();
            const user = await auth.whenUserLoaded();
            if (!user || !auth.isStaffAdmin(user)) {
                alert('관리자만 접근할 수 있습니다.');
                location.href = user ? 'dashboard.html' : 'login.html';
                return;
            }
            const params = new URLSearchParams(location.search);
            const id = params.get('userId');
            if (!id) {
                document.getElementById('sheet').innerHTML = '<p>userId가 필요합니다. 회원 관리에서 열어주세요.</p>';
                return;
            }
            const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
            try {
                const data = await api.get(`/users/${encodeURIComponent(id)}/privacy-consent`);
                const u = data.user || data;
                const items = u.privacy_consent_items || {};
                const when = u.privacy_consent_at
                    ? new Date(u.privacy_consent_at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })
                    : '동의 기록 없음';
                const mark = (v) => v ? '☑ 동의함' : '☐ 동의하지 않음';
                const signName = esc(u.privacy_consent_name || u.name || '');
                document.getElementById('sheet').innerHTML = `
                    <h1>개인 신용정보 수집·이용·제공 및 조회 동의서<br><span style="font-size:0.95rem;font-weight:500;">「고졸자 후속관리 지원모델 개발 사업」</span></h1>
                    <p>본 동의서의 내용을 이해하였으며 개인·신용정보 수집·이용·제공 및 조회에 관해 설명을 들은 것으로 합니다.</p>
                    <table>
                        <tr><th>성명</th><td>${signName || '-'}</td></tr>
                        <tr><th>이메일</th><td>${esc(u.email) || '-'}</td></tr>
                        <tr><th>연락처</th><td>${esc(u.phone) || '-'}</td></tr>
                        <tr><th>소속 학교</th><td>${esc(u.school_name) || '-'}</td></tr>
                        <tr><th>졸업(예정)년도</th><td>${esc(u.graduation_year) || '-'}</td></tr>
                        <tr><th>동의 시각</th><td>${esc(when)}</td></tr>
                        <tr><th>동의서 버전</th><td>${esc(u.privacy_consent_version) || '-'}</td></tr>
                    </table>
                    <div class="checks">
                        <p><strong>개인정보 수집·이용</strong> — ${mark(items.personal)}</p>
                        <p><strong>고유식별정보 제공</strong> — ${mark(items.unique_id)}</p>
                        <p><strong>불이익 안내 확인</strong> — ${mark(items.disadvantage)}</p>
                    </div>
                    <p class="muted">보유·이용기간: 졸업(예정)일로부터 5년. 동의 거부 시 취업 지원 서비스 제공이 제한됩니다.</p>
                    <div class="sign">
                        <p>성명: ${signName || '__________'} (서명 또는 인)</p>
                        <p>전자 동의 기록 — JJOBB</p>
                    </div>
                `;
            } catch (err) {
                document.getElementById('sheet').innerHTML = `<p>불러오기 실패: ${esc(err.message || err)}</p>`;
            }
        });
    </script>
</body>
</html>
