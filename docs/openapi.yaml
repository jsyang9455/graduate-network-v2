openapi: 3.0.3
info:
  title: jjobb_v2 Graduate Network API
  version: 2.0.0-sprint4
  description: Sprint 4 recommendations, field trips, networking school scope (+ Sprint 2–3). v1 `/api` keys are preserved.
servers:
  - url: http://localhost:5000
    description: Local / Docker Compose backend
tags:
  - name: Auth
  - name: Schools
  - name: IAM
  - name: Resumes
  - name: Files
  - name: Jobs
  - name: Counseling
  - name: Recommendations
  - name: FieldTrips
  - name: Networking
paths:
  /api/health:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (JWT includes role, school_id, user_type)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: token + user
        '401':
          description: UNAUTHENTICATED
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register; student/teacher/graduate require school_id
      responses:
        '201': { description: created }
        '400': { description: VALIDATION }
  /api/auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: current user }
        '401': { description: UNAUTHENTICATED }
  /api/auth/change-password:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Requires JWT (no anonymous change)
      responses:
        '200': { description: changed }
        '401': { description: UNAUTHENTICATED }
  /api/schools:
    get:
      tags: [Schools]
      summary: Public list of active schools (signup)
      parameters:
        - in: query
          name: include_inactive
          schema: { type: boolean }
      responses:
        '200': { description: '{ schools: [] }' }
    post:
      tags: [Schools]
      security: [{ bearerAuth: [] }]
      summary: system_admin manage
      responses:
        '201': { description: created }
        '403': { description: FORBIDDEN }
  /api/schools/{id}:
    get:
      tags: [Schools]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: school }
        '404': { description: NOT_FOUND }
    patch:
      tags: [Schools]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: updated }
        '403': { description: FORBIDDEN }
  /api/schools/{id}/departments:
    get:
      tags: [Schools]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: '{ departments: [] }' }
    post:
      tags: [Schools]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: created }
  /api/me/permissions:
    get:
      tags: [IAM]
      security: [{ bearerAuth: [] }]
      summary: Role × menu × actions for current JWT
      responses:
        '200':
          description: '{ role, school_id, menus[] }'
  /api/audit-logs:
    get:
      tags: [IAM]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '{ logs, pagination }' }
  /api/users/{id}:
    get:
      tags: [IAM]
      security: [{ bearerAuth: [] }]
      summary: Cross-school access returns 403
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: user }
        '403': { description: FORBIDDEN }
  /api/resumes:
    get:
      tags: [Resumes]
      security: [{ bearerAuth: [] }]
      summary: List own resumes (staff may pass user_id in same school)
      responses:
        '200': { description: '{ resumes: [] }' }
    post:
      tags: [Resumes]
      security: [{ bearerAuth: [] }]
      summary: Create resume with items (REQ-RSM-001/002)
      responses:
        '201': { description: created }
        '403': { description: FORBIDDEN }
  /api/resumes/{id}:
    get:
      tags: [Resumes]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: resume + items }
        '403': { description: FORBIDDEN }
    put:
      tags: [Resumes]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: updated }
    delete:
      tags: [Resumes]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: deleted }
  /api/resumes/{id}/primary:
    post:
      tags: [Resumes]
      security: [{ bearerAuth: [] }]
      summary: Mark as primary (REQ-RSM-002)
      responses:
        '200': { description: updated }
  /api/resumes/{id}/preview:
    get:
      tags: [Resumes]
      security: [{ bearerAuth: [] }]
      summary: HTML preview (REQ-RSM-003)
      responses:
        '200': { description: '{ html, resume }' }
  /api/resumes/{id}/pdf:
    post:
      tags: [Resumes]
      security: [{ bearerAuth: [] }]
      summary: Generate Korean-font PDF and store (REQ-RSM-004)
      responses:
        '201': { description: '{ file, document }' }
  /api/files/{id}:
    get:
      tags: [Files]
      security: [{ bearerAuth: [] }]
      summary: Download stored file (school-scoped)
      responses:
        '200': { description: binary }
        '403': { description: FORBIDDEN }
  /api/jobs/{id}/apply:
    post:
      tags: [Jobs]
      security: [{ bearerAuth: [] }]
      summary: Apply; accepts resume_id (REQ-JOB-005)
      responses:
        '201': { description: application }
  /api/jobs/applications/{id}/status:
    patch:
      tags: [Jobs]
      security: [{ bearerAuth: [] }]
      summary: Application workflow status (REQ-JOB-003/004)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, reviewed, interviewed, accepted, rejected]
      responses:
        '200': { description: updated }
        '400': { description: VALIDATION }
        '403': { description: FORBIDDEN }
  /api/notifications:
    get:
      tags: [Notify]
      security: [{ bearerAuth: [] }]
      summary: In-app notifications (REQ-MSG-010)
      responses:
        '200': { description: '{ notifications, unread_count }' }
  /api/counseling-journals/stats:
    get:
      tags: [Counseling]
      security: [{ bearerAuth: [] }]
      summary: Type/count/period stats (REQ-CNS-005)
      responses:
        '200': { description: '{ stats }' }
  /api/counseling-journals/timeline/{studentId}:
    get:
      tags: [Counseling]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '{ student, journals }' }
        '403': { description: FORBIDDEN }
  /api/counseling-journals/{id}/pdf:
    post:
      tags: [Counseling]
      security: [{ bearerAuth: [] }]
      summary: Counseling journal/confirmation PDF (REQ-CNS-004)
      responses:
        '201': { description: '{ file, document }' }
  /api/counseling-journals/{id}/docx:
    post:
      tags: [Counseling]
      security: [{ bearerAuth: [] }]
      summary: Counseling journal/confirmation DOCX (REQ-CNS-004)
      responses:
        '201': { description: '{ file, document }' }
  /api/recommendations/me:
    get:
      tags: [Recommendations]
      security: [{ bearerAuth: [] }]
      summary: Ranked recommendations with reasons (REQ-REC-004)
      responses:
        '200': { description: '{ recommendations, scoring_factors }' }
  /api/recommendations/associated:
    get:
      tags: [Recommendations]
      security: [{ bearerAuth: [] }]
      summary: Apply/scrap co-occurrence recommendations (REQ-REC-002)
      responses:
        '200': { description: '{ recommendations, seed_count, scoring_factors }' }
  /api/recommendations/recompute:
    post:
      tags: [Recommendations]
      security: [{ bearerAuth: [] }]
      summary: Recompute self/school/cron (REQ-REC-005)
      responses:
        '200': { description: recomputed }
  /api/recommendations/feedback:
    post:
      tags: [Recommendations]
      security: [{ bearerAuth: [] }]
      summary: impression|click|apply (REQ-REC-006)
      responses:
        '201': { description: recorded }
  /api/field-trips:
    get:
      tags: [FieldTrips]
      summary: List field trips (school scoped, REQ-TRP-001)
      responses:
        '200': { description: '{ field_trips }' }
    post:
      tags: [FieldTrips]
      security: [{ bearerAuth: [] }]
      summary: Create field trip
      responses:
        '201': { description: created }
  /api/field-trips/{id}/apply:
    post:
      tags: [FieldTrips]
      security: [{ bearerAuth: [] }]
      summary: Apply with capacity/fifo|approval (REQ-TRP-002)
      responses:
        '201': { description: application }
        '400': { description: CAPACITY }
        '403': { description: cross-school }
  /api/field-trips/{id}/roster:
    get:
      tags: [FieldTrips]
      security: [{ bearerAuth: [] }]
      summary: Roster (REQ-TRP-003)
      responses:
        '200': { description: roster }
        '403': { description: cross-school }
  /api/field-trips/{id}/report:
    get:
      tags: [FieldTrips]
      security: [{ bearerAuth: [] }]
      summary: After-report (REQ-TRP-003)
      responses:
        '200': { description: '{ trip, report }' }
        '403': { description: cross-school }
    put:
      tags: [FieldTrips]
      security: [{ bearerAuth: [] }]
      summary: Upsert after-report (REQ-TRP-003)
      responses:
        '200': { description: saved }
        '403': { description: cross-school }
  /api/worknet/status:
    get:
      tags: [Worknet]
      security: [{ bearerAuth: [] }]
      summary: Stub status NOT_CONFIGURED (REQ-WN-010)
      responses:
        '200': { description: '{ configured, code }' }
  /api/networking/mentors:
    get:
      tags: [Networking]
      security: [{ bearerAuth: [] }]
      summary: Same-school mentors (REQ-IAM-009)
      responses:
        '200': { description: mentors }
  /api/networking/connect/{userId}:
    post:
      tags: [Networking]
      security: [{ bearerAuth: [] }]
      summary: Connect; cross-school 403
      responses:
        '201': { description: pending }
        '403': { description: FORBIDDEN }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
